[versions]
detekt_version                  = "2.0.0-alpha.2"
kotlin_version                  = "2.3.10"
serialization_version           = "1.10.0"
spotless_version                = "8.2.1"

[libraries]
# Serialization
kotlinx-serialization           = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization_version" }


[plugins]
detekt                          = { id = "dev.detekt", version.ref = "detekt_version" }
kotlin-jvm                      = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin_version" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin_version" }
spotless                        = { id = "com.diffplug.spotless", version.ref = "spotless_version" }
