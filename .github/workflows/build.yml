name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build & Verify
        run: ./gradlew clean check build
        env:
            ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.ossrhUsername }}
            ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.secrets.ossrhPassword }}
